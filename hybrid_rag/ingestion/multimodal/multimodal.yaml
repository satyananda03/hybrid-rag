# Multimodal analysis prompts.
#
# Built into LangChain chains by app/services/vlm_service.py, so every `{name}`
# is a chain input variable and literal braces must be doubled.
#
# The output SHAPE is not described here: it is enforced by the provider from
# VisionAnalysis's JSON schema. What used to be a hand-written JSON template at
# the bottom of each prompt is now the model definition, which is also what
# parses the reply — so the two cannot drift apart.
#
# Each modality has ONE prompt. The `{context_block}` variable carries the
# surrounding-text section when the item has neighbours and is empty when it
# does not, replacing the old `*_with_context` twins.

image_analysis:
  system_prompt: |
    ROLE : You are an expert image analyst.
    LANGUAGE : Bahasa Indonesia

  user_prompt: |
    <instructions>
    1. CONTENT RECOGNITION & ADAPTABILITY
       Examine the image carefully. Identify its implicit type (e.g. Photo, Chart, Screenshot, Diagram, Flowchart, Infographic) and adapt your analysis:
       - For Charts/Diagrams: identify axes, labels, legends, and extract specific quantitative data points and trends.
       - For Screenshots/Interfaces: identify layout, main functional components, and visible text.
       - For Photos/Illustrations: identify the primary subject, scene, spatial layout, and relationships between elements.
       - For Text/Tables: quote short important text verbatim; summarize long blocks. Always use specific names instead of generic pronouns.

    2. USE OF ADDITIONAL CONTEXT
       You are given contextual metadata (surrounding text, section path, image path, captions, footnotes).
       - Use it to disambiguate acronyms, abbreviations, units, and entities.
       - STRICT RULE: the IMAGE ITSELF takes absolute priority. Describe only what is visually verifiable. Do NOT use the context to invent or assume visual elements that are not present in the image.

    3. detailed_description
       - Write comprehensive, natural prose (do NOT use bullet points).
       - Cover overall composition, visual style, colors, lighting, actions, and meaningful relationships between elements.

    4. entity_info
       - `entity_name`: a clean, semantic, distinctive title (3–8 words, snake_case preferred) representing the image content. Do NOT return raw file names or generic figure numbers (like `figure_30_1`) unless that is the literal title written on the image.
       - `entity_type`: MUST be exactly "image".
       - `summary`: concise summary of the image content and its core significance, max 100 words.
    </instructions>

    <context>
    {context_block} 
    
    Document structure:
    - Section Path: {section_path}

    Image details:
    - Image Path: {image_path}
    - Captions: {captions}
    - Footnotes: {footnotes}
    </context>

table_analysis:
  system_prompt: |
    ROLE : You are an expert document analyst and legal/policy researcher. Provide a highly detailed and comprehensive analysis of the table content.
    LANGUAGE : Bahasa Indonesia
    CRITICAL INSTRUCTION : For qualitative or text-heavy tables (such as government matrices, criteria, or regulations), you MUST extract and comprehensively explain the descriptions, criteria, administrative requirements, and institutional roles found in the cells.
    MANDATORY EXTRACTION : You are strictly required to identify and extract all key data points. This includes exact scores, thresholds, maturity levels, legal terms, specific clauses, and exact names of institutions or functions.
    Do not merely summarize or gloss over long texts. Capture the exact nuances, policy narratives, and structural relationships — those detailed explanations and key data points are the core insights.

  user_prompt: |
    <instructions>
    1. detailed_description — analyze the table and adapt to its content:
       - Table purpose, structure (columns, rows, hierarchy), and connection to surrounding text.
       - If normative/structural (aspects, indicators, criteria, articles, roles, procedures): state exact provisions, hierarchical relationships, weights, and score thresholds.
       - If quantitative (statistics, measurements, targets, budgets): report key data points, min/max, totals, trends, units, and time periods.
       - If mixed: apply both.
       - Include legal, policy or governmental data points (regulations, articles, laws, official decrees), compliance implications, sanctions or administrative requirements, and the roles, jurisdictions or hierarchy of the institutions mentioned.
       - Always use specific names, values and legal citations (Pasal, UU, Peraturan) instead of general references.

    2. entity_info
       - `entity_name`: "{entity_name}"
       - `entity_type`: MUST be exactly "table".
       - `summary`: the table's purpose, key findings, and its regulatory or governmental context, max 200 words.
    </instructions>

    CRITICAL Rules:
    1. Identify whether the table is normative, quantitative, or mixed — then apply the corresponding analysis.
    2. Enumerate ALL meaningful rows explicitly (NEVER write "several indicators" — list them).
    3. Preserve exact terminology, numbering, values, units, weights, and legal phrasing verbatim. Do NOT paraphrase or generalize.
    4. Capture hierarchical relationships where present (e.g. Aspect → Indicator → Criterion).
    5. For quantitative data: report exact figures, NEVER round or approximate.

    <context>
    {context_block}
    
    Table Information:
    - Caption: {table_caption}
    - Body: {table_body}
    - Footnotes: {table_footnote}
    </context>

equation_analysis:
  system_prompt: |
    ROLE : You are an expert mathematician. Provide detailed mathematical analysis.
    LANGUAGE : Bahasa Indonesia

  user_prompt: |
    <instructions>
    1. detailed_description — a comprehensive analysis of the equation covering:
       - Mathematical meaning and interpretation.
       - Variables and their definitions, read in the light of the surrounding content when provided.
       - Mathematical operations and functions used.
       - Application domain and context.
       - Physical or theoretical significance.
       - Relationship to other mathematical concepts, including any mentioned in the surrounding context.
       - Practical applications or use cases, and how the equation relates to the broader discussion.
       Always use specific mathematical terminology.

    2. entity_info
       - `entity_name`: "{entity_name}"
       - `entity_type`: MUST be exactly "equation".
       - `summary`: the equation's purpose, significance, and role in the surrounding context, max 100 words.
    </instructions>

    <context>
    {context_block}
    
    Equation Information:
    - Equation: {equation_text}
    - Format: {equation_format}
    </context>

generic_analysis:
  system_prompt: |
    ROLE : You are an expert content analyst specializing in {content_type} content.
    LANGUAGE : Bahasa Indonesia

  user_prompt: |
    <instructions>
    1. detailed_description — a comprehensive analysis of the content covering:
       - Content structure and organization.
       - Key information and elements.
       - Relationships between components.
       - Context and significance, including how this content connects to or supports the broader discussion when surrounding context is provided.
       - Relevant details for knowledge retrieval.
       Always use specific terminology appropriate for {content_type} content.

    2. entity_info
       - `entity_name`: "{entity_name}"
       - `entity_type`: MUST be exactly "{content_type}".
       - `summary`: the content's purpose, key points, and relationship to the surrounding context, max 100 words.
    </instructions>

    <context>
    {context_block}
    
    Content: {content}
    </context>

# Injected as {context_block} when the item has neighbouring text; rendered to an empty string when it does not.
surrounding_context:
  user_prompt: |
    Surrounding context:
    - Leading Text:
    ```{leading}```
    - Trailing Text:
    ```{trailing}```
