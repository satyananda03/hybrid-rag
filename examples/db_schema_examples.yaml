      fact_partisipasi_program:
        name: fact_partisipasi_program
        schema_name: iccn_dwh
        label: Partisipasi Program
        domain: Partisipasi Program
        description: Tabel ini menyimpan pendaftaran dari delapan sumber program ICCN, yaitu riset (daftar researcher), IP, festival, IP event, corporate partner, media narrative, pendataan kabupaten/kota kreatif, dan requestor. Satu baris mewakili satu submission, bukan angka rekap. Jumlah pendaftar dihitung dengan COUNT(*) dan dapat dikelompokkan berdasarkan jenis_program. Atribut umumnya mencakup nama pendaftar, institusi, peran, provinsi, kota, topik, subsektor, dan tanggal daftar. program_id terhubung ke dim_program melalui foreign key, sementara tanggal_id terhubung ke dim_waktu. Isian khusus tiap formulir berada di tabel detail_program_* dan dihubungkan lewat partisipasi_id.
        primary_keys:
        - partisipasi_id
        foreign_keys:
        - constrained_columns:
          - program_id
          referred_table: dim_program
          referred_schema: iccn_dwh
          referred_columns:
          - program_id
          name: fact_partisipasi_program_program_id_fkey
        - constrained_columns:
          - tanggal_id
          referred_table: dim_waktu
          referred_schema: iccn_dwh
          referred_columns:
          - tanggal_id
          name: fact_partisipasi_program_tanggal_id_fkey
        columns:
        - name: partisipasi_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: sumber_id
          description: ID baris asli dari tabel sumber pendaftaran (ditentukan oleh jenis_program), misal open_call_researches.id, open_call_ips.id, dst.
          type: UUID
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: program_id
          description: ID program, foreign key ke dim_program.program_id. Gunakan JOIN ke dim_program ON program_id = dim_program.program_id untuk mendapatkan nama_program. Detail isian tiap pendaftar ada di tabel detail_program_* (JOIN via partisipasi_id).
          type: INTEGER
          is_primary_key: false
          is_nullable: false
          foreign_keys:
          - referred_table: dim_program
            referred_schema: iccn_dwh
            referred_columns:
            - program_id
            name: fact_partisipasi_program_program_id_fkey
        - name: jenis_program
          description: 'Kode jenis program (huruf besar). Nilai persis: RISET, IP, FESTIVAL, IP_EVENT, CORPORATE_PARTNER, MEDIA_NARRATIVE, KATA_KREATIF, REQUESTOR. Filter dengan kode ini (contoh: jenis_program = ''RISET''), bukan nama program seperti ''Open Call Riset''; nama lengkap ada di dim_program.nama_program.'
          type: TEXT
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
          enum_values:
          - FESTIVAL
          - IP
          - IP_EVENT
          - KATA_KREATIF
          - REQUESTOR
          - RISET
        - name: nama_pendaftar
          description: Nama pendaftar/peserta program, digabungkan dari kolom nama pada berbagai tabel sumber (researcher_name, fullname, organization_name, registrant_name, festival_name). Satu baris = satu pendaftaran, bukan satu orang; pendaftaran tim memuat beberapa nama anggota dalam satu teks (misal 'A, B dan C'), jadi atribut lain di baris yang sama milik pendaftaran itu, bukan milik nama tertentu di dalamnya.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: institusi
          description: Institusi/organisasi pendaftar, digabungkan dari kolom institution/organization_name pada berbagai tabel sumber.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: peran
          description: Peran pendaftar dalam program, digabungkan dari kolom role/position pada berbagai tabel sumber.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Aggregator
          - Agregator
          - Akademisi
          - Anggota tim riset
          - Co-creator / tim kreatif
          - Internasional
          - Kab/Kota
          - Ketua tim riset
          - Komunitas
          - Manajemen / agency
          - Media
          - Nasional
          - Pelaku Usaha (Bisnis)
          - Pemerintah
          - Pemilik IP
          - Peneliti individu
          - Perwakilan institusi riset
          - Perwakilan studio / perusahaan
          - Provinsi
          - Sebagai putera lingkungan Sumatera Utara
          - Yayasan
        - name: email
          description: Alamat email kontak pendaftaran (pendaftar/penanggung jawab). Satu email per pendaftaran; bila nama_pendaftar berisi beberapa anggota tim, email ini tidak bisa diatribusikan ke anggota tertentu.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: phone
          description: Nomor telepon/WhatsApp kontak pendaftaran, umumnya berformat 62xxxxxxxxxx (tanpa '+'). Satu nomor per pendaftaran; bila nama_pendaftar berisi beberapa anggota tim, nomor ini tidak bisa diatribusikan ke anggota tertentu.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: provinsi
          description: 'Provinsi domisili pendaftar/penyelenggara, digabungkan dari kolom province pada berbagai tabel sumber. Provinsi yang sama ditulis dalam beberapa varian; selalu filter dengan IN (...) untuk semua variannya: Jakarta = ''DKI JAKARTA'', ''DAERAH KHUSUS JAKARTA''; Yogyakarta = ''DI YOGYAKARTA'', ''DAERAH ISTIMEWA YOGYAKARTA''; Aceh = ''ACEH'', ''01. ACEH''. Untuk total per provinsi, gabungkan varian dengan CASE ke nama di dim_wilayah (DKI JAKARTA / DI YOGYAKARTA / ACEH). Nilai ''BEBERAPA KOTA'', ''SATU KOTA/KABUPATEN'', ''SKALA NASIONAL'', dan ''STUDI KOMPARATIF ANTAR KOTA'' bukan provinsi.'
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - 01. ACEH
          - ACEH
          - BALI
          - BANTEN
          - BEBERAPA KOTA
          - BENGKULU
          - DAERAH ISTIMEWA YOGYAKARTA
          - DAERAH KHUSUS JAKARTA
          - DI YOGYAKARTA
          - DKI JAKARTA
          - GORONTALO
          - JAMBI
          - JAWA BARAT
          - JAWA TENGAH
          - JAWA TIMUR
          - KALIMANTAN BARAT
          - KALIMANTAN SELATAN
          - KALIMANTAN TENGAH
          - KALIMANTAN TIMUR
          - KEPULAUAN RIAU
          - LAMPUNG
          - MALUKU
          - NUSA TENGGARA BARAT
          - NUSA TENGGARA TIMUR
          - RIAU
          - SATU KOTA/KABUPATEN
          - SKALA NASIONAL
          - STUDI KOMPARATIF ANTAR KOTA
          - SULAWESI BARAT
          - SULAWESI SELATAN
          - SULAWESI TENGAH
          - SULAWESI TENGGARA
          - SULAWESI UTARA
          - SUMATERA BARAT
          - SUMATERA SELATAN
          - SUMATERA UTARA
        - name: kota
          description: Kota/Kabupaten domisili pendaftar/penyelenggara, digabungkan dari kolom city pada berbagai tabel sumber.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: topik
          description: Topik atau judul pengajuan, digabungkan dari kolom seperti research_topic, ip_name, contribution_title, festival_name pada berbagai tabel sumber.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: subsektor
          description: Subsektor ekonomi kreatif terkait pengajuan, digabungkan dari kolom main_subsector pada berbagai tabel sumber.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: tanggal_daftar_wib
          description: Tanggal dan waktu pendaftaran/submit program (created_at pada tabel sumber).
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: tanggal_id
          description: Tanggal pendaftaran dalam format integer YYYYMMDD, foreign key ke dim_waktu.tanggal_id. Gunakan JOIN ke dim_waktu untuk agregasi pendaftar per bulan/kuartal/tahun.
          type: INTEGER
