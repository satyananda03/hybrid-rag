      fact_berita:
        name: fact_berita
        schema_name: iccn_dwh
        label: Berita
        domain: Berita & Event
        description: Tabel ini menyimpan berita dan artikel platform ICCN. Satu baris mewakili satu berita yang memuat judul, isi lengkap di kolom content, status, kota, jumlah views, status publik, dan tanggal terbit. kategori_id terhubung ke dim_kategori melalui foreign key, sementara tanggal_id dapat digunakan untuk bergabung dengan dim_waktu. title_vector dan content_vector menyimpan embedding untuk pencarian berdasarkan kemiripan makna. Sebagian berita belum memiliki content_vector dari sumbernya
        primary_keys:
        - berita_id
        foreign_keys:
        - constrained_columns:
          - kategori_id
          referred_table: dim_kategori
          referred_schema: iccn_dwh
          referred_columns:
          - kategori_id
          name: fact_berita_kategori_id_fkey
        columns:
        - name: berita_id
          description: Primary Key
          type: UUID
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: kategori_id
          description: |-
            ID kategori berita, merujuk ke tabel dim_kategori untuk mengetahui jenis kategorinya (Artikel, Berita, Event, atau Talkshow).
            Gunakan JOIN ke dim_kategori ON kategori_id = dim_kategori.kategori_id
          type: UUID
          is_primary_key: false
          is_nullable: true
          foreign_keys:
          - referred_table: dim_kategori
            referred_schema: iccn_dwh
            referred_columns:
            - kategori_id
            name: fact_berita_kategori_id_fkey
        - name: judul
          description: |-
            Judul berita/artikel yang dipublikasikan.
            Gunakan ILIKE hanya jika user menyebut keyword spesifik yang jelas.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: content
          description: |-
            Isian atau content dari berita/news tertentu.
            NOTE : Pastikan select kolom ini jika user bertanya terkait isian dari berita tertentu!
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: status
          description: |-
            Status publikasi berita. Nilai yang mungkin: "published", "external", "scheduled", "revised".
            Untuk menampilkan berita yang sudah live, filter WHERE status IN ('published', 'external').
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - external
          - published
        - name: kota
          description: Lokasi kabupaten/kota dimana berita tersebut terjadi atau relevan
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: views
          description: |-
            Jumlah total views/tayangan dari berita.
            Gunakan kolom ini untuk statistik popularitas, ranking, atau sorting berita berdasarkan jumlah pembaca.
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: is_public
          description: Visibilitas berita. True jika berita dapat dilihat oleh umum/publik, False jika berita hanya dapat dilihat oleh member terdaftar.
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: tanggal_publish_wib
          description: |-
            Tanggal dan waktu berita dipublikasikan.
            Gunakan kolom ini untuk ORDER BY (terbaru) atau filter rentang waktu.
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: tanggal_id
          description: Tanggal publikasi berita dalam format integer YYYYMMDD. Gunakan JOIN ke dim_waktu ON tanggal_id = dim_waktu.tanggal_id untuk agregasi per bulan/kuartal/tahun.
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: title_vector
          description: Pencarian semantik untuk judul berita. Gunakan saat user mencari berita berdasarkan kemiripan makna judul, bukan kecocokan kata persis.
          type: VECTOR(1024)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          vector_source: judul
        - name: content_vector
          description: Pencarian semantik untuk isi berita. Gunakan saat user mencari berita berdasarkan kemiripan makna/topik isi, bukan kecocokan kata persis.
          type: VECTOR(1024)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          vector_source: content
      fact_event:
        name: fact_event
        schema_name: iccn_dwh
        label: Event
        domain: Berita & Event
        description: Tabel ini menyimpan event yang tercantum di platform ICCN. Satu baris mewakili satu event yang memuat nama, deskripsi, lokasi, waktu mulai dan selesai, serta status aktif. tanggal_id_mulai dapat digunakan untuk bergabung dengan dim_waktu. Lokasi masih berupa teks bebas yang dapat berisi nama tempat, beberapa kota, atau keterangan online. Pencarian kata kunci dapat memakai ILIKE, tetapi lokasi tidak terhubung ke dim_wilayah. description_vector menyimpan embedding untuk mencari event berdasarkan kemiripan deskripsi.
        primary_keys:
        - event_id
        foreign_keys: []
        columns:
        - name: event_id
          description: Primary Key
          type: UUID
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: nama_event
          description: Nama Event/Acara yang diselenggarakan
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: description
          description: Deskripsi kegiatan yang dilakukan pada Event/Acara tersebut
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: lokasi
          description: Lokasi dilaksanakannya Event/Acara tersebut (nama tempat atau alamat)
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: is_active
          description: Status Event/Acara. True artinya event masih aktif, False artinya event sudah tidak aktif atau selesai.
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: mulai_wib
          description: Waktu dimulainya Event/Acara.
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: selesai_wib
          description: Waktu selesainya Event/Acara.
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: tanggal_id_mulai
          description: Tanggal mulai event dalam format integer YYYYMMDD. Gunakan JOIN ke dim_waktu ON tanggal_id_mulai = dim_waktu.tanggal_id untuk agregasi per bulan/kuartal/tahun.
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: description_vector
          description: Pencarian semantik untuk deskripsi event. Gunakan saat user mencari event berdasarkan kemiripan makna deskripsi, misalnya tema atau jenis kegiatan tertentu.
          type: VECTOR(1024)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          vector_source: description
      fact_insight_ikm:
        name: fact_insight_ikm
        schema_name: iccn_dwh
        label: Insight IKM
        domain: Insight IKM & UMKM
