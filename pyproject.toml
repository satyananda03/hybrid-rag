[project]
name = "hybrid-rag"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<3.13"

dependencies = [
    "asyncpg>=0.31.0,<1.0.0",
    "langchain-core>=1.0,<2",
    "neo4j>=6.2.0",
    "numpy>=1.24.0,<3.0.0",
    "pgvector>=0.4.2,<1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.1",
    "PyYAML>=6.0,<7.0",
    "sastrawi>=1.0.1",
    "tenacity",
    "tiktoken",
    "en-core-web-sm",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "unoserver==3.4",
]

[project.optional-dependencies]
ingestion = [
    "boto3>=1.40.61",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=0.3,<2",
    "pillow>=10.1.0",
    "pymupdf>=1.28.0",
    "html-table-rescuer>=0.3.1",
    "unstructured[docx,xlsx]>=0.27.25",
    "neo4j-graphrag>=1.13",
    "rdflib>=7",
    "rapidfuzz>=3",
]

dashboard = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "ipykernel>=7.4.0",
]

# spaCy models are not on PyPI: pin the release wheel (spacy 3.8.x).
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["hybrid_rag/dashboard/static"]

[tool.hatch.build.targets.wheel]
packages = ["hybrid_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs the live PostgreSQL from .env (read-only queries); run with `make test-integration`"]
