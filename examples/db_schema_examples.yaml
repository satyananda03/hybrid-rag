name: iccn_data_lake
description: |-
  Data terpusat ICCN (Indonesia Creative Cities Network).
  - TIDAK tersedia: data keuangan ICCN (dana hibah, pencairan/penyaluran dana, anggaran ICCN). Kolom total_budget/funding_sources di detail_program_ip_event hanyalah anggaran festival yang diisi pendaftar, bukan dana ICCN.
domains:
- name: Berita & Event
  description: Judul, isi, views, dan status publikasi berita ada di fact_berita; jadwal dan lokasi event ada di fact_event. Kategori konten (Artikel/Berita/Event/Talkshow) ada di dim_kategori.
- name: Member ICCN
  description: Profil member/pelaku ekonomi kreatif di ICCN (nama, domisili kota/provinsi, subsektor ekraf, bio) ada di dim_user.
- name: Pelaku Ekraf Sulawesi Tenggara
  description: Data usaha, pemilik, lokasi (provinsi/kabupaten/kecamatan sudah di kolomnya sendiri, tanpa dim_wilayah), dan subsektor pelaku ekraf ada di fact_pelaku_ekraf; HKI (Hak Kekayaan Intelektual) yang dimiliki pelaku ekraf ada di bridge_pelaku_hki.
- name: Jejaring ICCN Daerah
  description: Sebaran jejaring per wilayah (korda, ketua, status tumbuh/tidak aktif) ada di fact_sebaran_jejaring.
- name: Partisipasi Program
  description: Data pendaftar Open Call (riset, IP, festival, korporat, narasi media, dll.) dan program pendataan lain ada di fact_partisipasi_program, dibedakan lewat kolom jenis_program.
- name: Insight IKM & UMKM
  description: Statistik jumlah dan performa Industri Kecil Menengah (fact_insight_ikm) dan UMKM (fact_insight_umkm) per wilayah.
- name: Knowledge Base
  description: Daftar dokumen yang masuk ke knowledge ICCN (sumber Notion, Google Drive, Database, Document Upload) ada di iccn_knowledge_stats.
- name: Dimensi Waktu & Wilayah
  description: Gunakan dim_waktu untuk agregasi berdasarkan hari/bulan/kuartal/tahun; dim_wilayah untuk daftar wilayah.
schemas:
  iccn_dwh:
    name: iccn_dwh
    tables:
      bridge_pelaku_hki:
        name: bridge_pelaku_hki
        schema_name: iccn_dwh
        label: HKI Pelaku Ekraf
        domain: Pelaku Ekraf Sulawesi Tenggara
        description: |-
          Tabel relasi (bridge table) antara pelaku ekraf dengan hak kekayaan intelektual (HKI) yang dimilikinya.
          Gunakan JOIN ke fact_pelaku_ekraf ON sumber_pelaku_id = fact_pelaku_ekraf.sumber_id untuk mengetahui data usaha pemilik HKI.
        primary_keys:
        - bridge_id
        foreign_keys: []
        columns:
        - name: bridge_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: sumber_pelaku_id
          description: ID pelaku ekraf, merujuk ke kolom sumber_id pada tabel fact_pelaku_ekraf
          type: BIGINT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: jenis_hki
          description: 'Nama jenis hak kekayaan intelektual (contoh: Paten, Hak Cipta, Merek)'
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Desain Tata Letak Sirkuit Terpadu
          - Hak Cipta
          - Indikasi Geografis
          - Merek
          - Paten
          - Rahasia Dagang
      detail_program_corporate_partner:
        name: detail_program_corporate_partner
        schema_name: iccn_dwh
        label: Detail Open Call Corporate Partner
        domain: Partisipasi Program
        description: 'Tabel yang menyimpan data perusahaan, institusi bisnis, dan organisasi profesional yang mendaftar untuk kolaborasi dalam pengembangan ekosistem kota/kabupaten kreatif Indonesia. Cakupan informasi: - Identitas Organisasi: Nama perusahaan/organisasi (organization_name), bentuk badan usaha (entity_type), bidang usaha/industri (business_field), domisili kota/kabupaten (city), cakupan wilayah operasional (operational_area), serta profil singkat (organization_profile) dan website. - Minat & Bentuk Kolaborasi: Fokus bidang kolaborasi yang diminati (collaboration_focuses), bentuk kolaborasi yang ditawarkan (collaboration_types), wilayah fokus kolaborasi (collaboration_regions), durasi kolaborasi (collaboration_duration), gagasan spesifik kolaborasi dengan ICCN (collaboration_idea), dan ekspektasi dampak (expected_impact). - Pengalaman Sebelumnya: Status kepemilikan pengalaman kolaborasi sebelumnya (previous_collaboration_types - boolean), serta deskripsi singkat mengenai pengalaman tersebut (previous_collaboration_description). - Data Penanggung Jawab (PIC): Nama lengkap (pic_name), jabatan (pic_position), email (pic_email), dan nomor telepon/WhatsApp (pic_phone). NOTES : - JANGAN gunakan operator @> untuk JSONB array.  - Selalu cast menjadi text dan gunakan ILIKE untuk pencarian case-insensitive (misal: collaboration_types::text ILIKE ''''%pengembangan program bersama%'''').'
        primary_keys:
        - detail_id
        foreign_keys:
        - constrained_columns:
          - partisipasi_id
          referred_table: fact_partisipasi_program
          referred_schema: iccn_dwh
          referred_columns:
          - partisipasi_id
          name: detail_program_corporate_partner_partisipasi_id_fkey
        columns:
        - name: detail_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: partisipasi_id
          description: |-
            ID partisipasi, foreign key ke fact_partisipasi_program.partisipasi_id. Satu baris = satu pendaftar program Open Call Corporate Partner (mitra korporasi).
            Gunakan JOIN ke fact_partisipasi_program ON partisipasi_id = fact_partisipasi_program.partisipasi_id untuk mengambil nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar.
          type: INTEGER
          is_primary_key: false
          is_nullable: false
          foreign_keys:
          - referred_table: fact_partisipasi_program
            referred_schema: iccn_dwh
            referred_columns:
            - partisipasi_id
            name: detail_program_corporate_partner_partisipasi_id_fkey
        - name: entity_type
          description: Bentuk Badan Usaha
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - PT
          - CV
          - Firma
          - Yayasan / Organisasi
          - Institusi pendidikan
        - name: business_field
          description: 'Bidang Usaha / Industri Contoh data : Industri Kreatif'
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Industri Kreatif
          - Teknologi & Digital
          - Keuangan & Perbangkan
          - Energi & Lingkungan
          - Infrastruktur & Properti
          - Pendidikan
        - name: operational_area
          description: 'Wilayah Operasional Perusahaan NOTES : Gunakan exact match!'
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Lokal
          - Regional
          - Nasional
          - Internasional
        - name: website
          description: Website / Profil Organisasi
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: organization_profile
          description: Profil Singkat Organisasi
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: collaboration_focuses
          description: Bidang kolaborasi yang diminati perusahaan (fokus kolaborasi) Disimpan dalam format JSON array of strings.
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - pengembangan program kota kreatif
          - pengembangan subsektor ekonomi kreatif
          - inovasi kota dan urban development
          - riset dan pengetahuan ekonomi kreatif
          - pengembangan kapasitas komunitas kreatif
          - penguatan jejaring kota/kabupaten kreatif
          - inisiatif sosial berbasis ekonomi kreatif
        - name: collaboration_types
          description: 'Bentuk kolaborasi yang diminati perusahaan Disimpan dalam format JSON array of strings. Contoh data : ["dukungan terhadap inisiatif kota kreatif", "pengembangan program bersama"]'
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - pengembangan program bersama
          - dukungan terhadap inisiatif kota kreatif
          - kolaborasi riset atau knowledge program
          - pengembangan platform atau ekosistem kreatif
          - kemitraan jangka panjang dalam pengembangan program
          - bentuk kolaborasi lain
        - name: collaboration_regions
          description: Kota/wilayah yang menjadi fokus kolaborasi
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: collaboration_duration
          description: Durasi kolaborasi yang diminati
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: previous_collaboration_description
          description: Deskripsi singkat pengalaman kolaborasi sebelumnya
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: collaboration_idea
          description: Gagasan kolaborasi dengan ICCN (inisiatif atau program apa yang ingin dikembangkan bersama)
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: expected_impact
          description: Kontribusi apa yang dapat diberikan kolaborasi ini bagi pengembangan kota/kabupaten kreatif di Indonesia
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: is_terms_agreed
          description: Persetujuan pernyataan
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: previous_collaboration_types
          description: Apakah perusahaan memiliki pengalaman kolaborasi dengan Komunitas Kreatif, Pemerintah Daerah, Program Sosial atau Pembangunan Kota, ataupun Institusi Pendidikan/Riset sebelumnya
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
      detail_program_festival:
        name: detail_program_festival
        schema_name: iccn_dwh
        label: Detail Open Call Festival
        domain: Partisipasi Program
        description: 'Tabel yang menyimpan data pendaftaran festival untuk memetakan, mendampingi, dan mengembangkan festival berbasis potensi lokal Cakupan informasi: - Identitas & Detail Festival: Nama festival (festival_name), tingkatan (festival_level), riwayat penyelenggaraan (first_year, current_edition), lokasi (province, city, main_venue), waktu & durasi (event_date, duration), serta media sosial (social_media). - Data Penyelenggara & Kelembagaan: Bentuk kelembagaan (institutional_form), tahun berdiri (established_year), alamat sekretariat (secretariat_address), status badan hukum (has_legal_ownership, legal_ownership_file), mitra utama (main_partner), serta data penanggung jawab (pic_name, pic_email, pic_phone). - Konsep & Latar Belakang: Kategori latar belakang (background_of_festival - JSONB), deskripsi latar belakang (background_desc), keunikan festival (uniqueness), dan status kepemilikan tema tahunan (has_an_annual_theme). - Kegiatan & Sistem Kerja: Jenis kegiatan utama (main_activities - JSONB), jumlah kegiatan (total_activities), serta sistem kerja kolektif (collective_work_system - JSONB). - Keterlibatan Ekosistem: Keterlibatan komunitas lokal (involves_local_community, involves_local_community_as_collab), pelibatan seniman/profesional (involves_artists), jumlah pelaku kreatif/UMKM (total_creative_professionals), dan estimasi pengunjung (estimated_visitors). - Lampiran & Harapan: File dokumentasi (festival_documentation_file), file proposal (festival_proposal_file), serta harapan terhadap jejaring ICCN (iccn_network_expectations). - Metadata: Timestamp standar (created_at, updated_at, deleted_at). NOTES : - JANGAN gunakan operator @> untuk JSONB array. Selalu cast menjadi text dan gunakan ILIKE untuk pencarian case-insensitive'
        primary_keys:
        - detail_id
        foreign_keys:
        - constrained_columns:
          - partisipasi_id
          referred_table: fact_partisipasi_program
          referred_schema: iccn_dwh
          referred_columns:
          - partisipasi_id
          name: detail_program_festival_partisipasi_id_fkey
        columns:
        - name: detail_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: partisipasi_id
          description: |-
            ID partisipasi, foreign key ke fact_partisipasi_program.partisipasi_id. Satu baris = satu pendaftar program Open Call Festival.
            Gunakan JOIN ke fact_partisipasi_program ON partisipasi_id = fact_partisipasi_program.partisipasi_id untuk mengambil nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar.
          type: INTEGER
          is_primary_key: false
          is_nullable: false
          foreign_keys:
          - referred_table: fact_partisipasi_program
            referred_schema: iccn_dwh
            referred_columns:
            - partisipasi_id
            name: detail_program_festival_partisipasi_id_fkey
        - name: festival_name
          description: Nama festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: first_year
          description: Kapan tahun pertama diadakan festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: current_edition
          description: Edisi ke berapa tahun ini
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: festival_level
          description: 'Tingkatan festival  Nilai string yang valid persis seperti berikut (tanpa angka dan penjelasan): - "National" - "Internasional" - "Provinsi" - "Kab/Kota"'
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Internasional
          - Kab/Kota
          - Nasional
          - Provinsi
        - name: main_venue
          description: Lokasi utama festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: event_date
          description: Waktu penyelenggaraan
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: duration
          description: Durasi penyelenggaraan festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: social_media
          description: Media sosial festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: institutional_form
          description: 'Bentuk Kelembagaan penyelenggara (pilihan : komunitas, yayasan, perkumpulan, badan usaha)'
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - badan_usaha
          - Badan Usaha
          - Dewan Kesenian Pinrang / Sanggar Seni Lasinrang
          - Komite
          - komunitas
          - Komunitas
          - Lembaga Pendidikan Tinggi Negeri
          - lembaga seni budaya muslimin indonesia (LESBUMI)
          - perkumpulan
          - Perkumpulan
          - yayasan
          - Yayasan
        - name: established_year
          description: Tahun berdirinya penyelenggara
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: secretariat_address
          description: Alamat sekretariat penyelenggara
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: has_legal_ownership
          description: Kepemilikan badan hukum bagi penyelenggara, True jika memiliki badan hukum
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: legal_ownership_file
          description: File bukti kepemilikan badan hukum, wajib dijoin menjadi https://iccn-s3-bucket.s3.ap-southeast-1.amazonaws.com/{legal_ownership_file}
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: main_partner
          description: Mitra utama festival
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: background_of_festival
          description: 'Kategori latar belakang festival Disimpan dalam format JSON array of strings. Contoh data : ["Pelestarian Budaya", "Ruang ekspresi", "Pelestarian lingkungan", "Ekonomi kreatif", "Sosial"] NOTES : Jika query user TIDAK ADA di daftar nilai tersebut, WAJIB cast kolom ke text sebelum pakai ILIKE'
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Pelestarian budaya
          - Ruang ekspresi
          - Pelestarian lingkungan
          - Ekonomi kreatif
          - Sosial
        - name: background_desc
          description: Deskripsi latar belakang festival dan keterkaitan dengan identitas lokal
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: uniqueness
          description: Deskripsi keunikan/uniqueness festival dibanding festival lain
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: has_an_annual_theme
          description: Apakah festival memiliki tema tahunan, True jika iya
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: main_activities
          description: 'Jenis kegiatan utama festival Disimpan dalam format JSON array of strings. Contoh data : ["Pertunjukan seni", "Pameran seni/kriya"] NOTES : Jika query user TIDAK ADA di daftar nilai tersebut, WAJIB cast kolom ke text sebelum pakai ILIKE'
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Pertunjukan seni
          - Pameran seni/kriya
          - Kuliner
          - Musik
          - Film
          - Workshop
          - Diskusi/forum
          - Aktivasi ruang publik
        - name: total_activities
          description: Jumlah total kegiatan dalam rangkaian festival
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: collective_work_system
          description: 'Sistem kerja festival secara kolektif Disimpan dalam format JSON array of strings. Contoh data : ["Gotong Royong", "Kolaborasi antar komunitas"]'
          type: JSONB
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Gotong royong
          - Kolaborasi antar komunitas
          - Hiring EO/Profesional
        - name: involves_local_community
          description: Apakah festival melibatkan komunitas lokal?, True jika iya
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: involves_artists
          description: Apakah festival melibatkan seniman nasional/internasional?, True jika iya
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: involves_local_community_as_collab
          description: Apakah festival melibatkan masyarakat sekitar sebagai kolaborator?, True jika iya
          type: BOOLEAN
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: estimated_visitors
          description: Estimasi jumlah pengunjung
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: total_creative_professionals
          description: Jumlah pelaku kreatif/UMKM yang terlibat
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: festival_documentation_file
          description: dokumen dokumentasi festival, wajib dijoin menjadi https://iccn-s3-bucket.s3.ap-southeast-1.amazonaws.com/{festival_documentation_file}
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: festival_proposal_file
          description: dokumen proposal festival, wajib dijoin menjadi https://iccn-s3-bucket.s3.ap-southeast-1.amazonaws.com/{festival_proposal_file}
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: iccn_network_expectations
          description: Harapan jika festival ini terhubung dengan ICCN
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
      detail_program_ip:
        name: detail_program_ip
        schema_name: iccn_dwh
        label: Detail Open Call Intellectual Property
        domain: Partisipasi Program
        description: 'Tabel yang menyimpan daftar Kekayaan Intelektual (Intellectual Property (IP)) dari kreator, komunitas, studio kreatif, dan pelaku ekonomi kreatif di ICCN.  Cakupan Informasi :  - Identitas Pendaftar: Nama pendaftar (fullname), nama tim/studio/komunitas (team_name), email, kontak WhatsApp (phone), serta lokasi asal (province, city).  - Detail & Karakteristik IP: Nama IP (ip_name), deskripsi (ip_description), keunikan (ip_uniqueness), kategori IP (ip_category), subsektor utama (main_subsector), subsektor pendukung (supporting_subsectors), target audiens (target_audience), dan nilai yang ditawarkan (ip_values).  - Status & Legalitas: Tahap pengembangan IP (development_stage), rencana masa depan (development_plan), dan status pendaftaran Hak Cipta/HAKI (is_copyright_registered) beserta buktinya.  - Dampak & Harapan Kolaborasi: Potensi dampak ke kota kreatif (ip_potential_impact, ip_locality_connection), bentuk dukungan yang diharapkan dari ICCN (expected_support), dan keterbukaan kolaborasi (collaboration_status).  - Lampiran & Tautan: File portofolio (portfolio_files, portfolio_link), bukti HAKI (copyright_evidence_files), link berita (news_links), dan media sosial (website_social_links).'
        primary_keys:
        - detail_id
        foreign_keys:
        - constrained_columns:
          - partisipasi_id
          referred_table: fact_partisipasi_program
          referred_schema: iccn_dwh
          referred_columns:
          - partisipasi_id
          name: detail_program_ip_partisipasi_id_fkey
        columns:
        - name: detail_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: partisipasi_id
          description: |-
            ID partisipasi, foreign key ke fact_partisipasi_program.partisipasi_id. Satu baris = satu pendaftar program Open Call Intellectual Property (IP).
            Gunakan JOIN ke fact_partisipasi_program ON partisipasi_id = fact_partisipasi_program.partisipasi_id untuk mengambil nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar.
          type: INTEGER
          is_primary_key: false
          is_nullable: false
          foreign_keys:
          - referred_table: fact_partisipasi_program
            referred_schema: iccn_dwh
            referred_columns:
            - partisipasi_id
            name: detail_program_ip_partisipasi_id_fkey
        - name: ip_name
          description: Nama Intelektual Property (IP) yang diajukan
          type: VARCHAR(255)
          is_primary_key: false
          is_nullable: true
