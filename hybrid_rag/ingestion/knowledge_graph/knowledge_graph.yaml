#     3. DIRECTION & DUPLICATION
#        Treat every relationship as **undirected** unless stated otherwise — swapping source and target is not a new relationship. Do not output duplicates.

#     4. LIMITS & PRIORITIZATION
#        - At most {max_total_records} total records across entities and relationships in this response.
#        - At most {max_entity_records} entity objects in this response.
#        - Output fewer if fewer high-value items exist. Do not pad to reach the limit.
