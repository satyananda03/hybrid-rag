      dim_waktu:
        name: dim_waktu
        schema_name: iccn_dwh
        label: Waktu
        domain: Dimensi Waktu & Wilayah
        description: |-
          Tabel dimensi waktu (date dimension), berisi satu baris per tanggal kalender dari 2020-01-01 s.d. 2030-12-31. Primary key tanggal_id adalah tanggal dalam format integer YYYYMMDD (contoh: 2026-03-17 -> 20260317), sehingga JOIN cukup dengan mencocokkan kolom tanggal_id di tabel fact tanpa perlu CAST.
          Gunakan tabel ini untuk agregasi berdasarkan hari/bulan/kuartal/tahun (GROUP BY nama_bulan, kuartal, atau tahun) dari :
          - fact_berita (JOIN ON fact_berita.tanggal_id = dim_waktu.tanggal_id)
          - fact_event (JOIN ON fact_event.tanggal_id_mulai = dim_waktu.tanggal_id)
          - fact_partisipasi_program (JOIN ON fact_partisipasi_program.tanggal_id = dim_waktu.tanggal_id)
        primary_keys:
        - tanggal_id
        foreign_keys: []
        columns:
        - name: tanggal_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: tanggal
          description: 'Tanggal kalender (DATE), rentang 2020-01-01 s.d. 2030-12-31. Primary key tanggal_id adalah tanggal ini dalam format integer YYYYMMDD (contoh: 2026-03-17 -> 20260317).'
          type: DATE
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: hari
          description: Tanggal dalam bulan (1-31), bukan nama hari.
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: bulan
          description: Nomor bulan (1-12).
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: nama_bulan
          description: Nama bulan dalam bahasa Inggris (January, February, ..., December). Terjemahkan ke bahasa Indonesia saat menampilkan jawaban.
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - April
          - August
          - December
          - February
          - January
          - July
          - June
          - March
          - May
          - November
          - October
          - September
        - name: kuartal
          description: 'Kuartal dalam tahun, nilai: ''Q1'', ''Q2'', ''Q3'', ''Q4''.'
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
          enum_values:
          - Q1
          - Q2
          - Q3
          - Q4
        - name: tahun
          description: Tahun (2020-2030).
          type: INTEGER
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
      dim_wilayah:
        name: dim_wilayah
