[project]
name = "hybrid-rag"
version = "0.1.0"
description = ""
requires-python = ">=3.11,<3.13"

dependencies = [
    "asyncpg>=0.31.0,<1.0.0",
    "langchain-core>=1.0,<2",
    "neo4j>=6.2.0",
    "numpy>=1.24.0,<3.0.0",
    "pgvector>=0.4.2,<1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.1",
    "PyYAML>=6.0,<7.0",
    "sastrawi>=1.0.1",
    "tenacity",
    "tiktoken",
]

[project.optional-dependencies]
ingestion = [
    "boto3>=1.40.61",
    "langchain-text-splitters>=0.3,<2",
    "pillow>=10.1.0",
    "pymupdf>=1.28.0",
    # the `unoconvert` client; the server is ghcr.io/unoconv/unoserver-docker
    "unoserver==3.4",
    "html-table-rescuer>=0.3.1",
    "unstructured[docx,xlsx]>=0.27.25",
    # ontology-driven KG extraction (knowledge_graph/ontology_schema.py)
    "neo4j-graphrag>=1.13",
    "rdflib>=7",
]

dashboard = ["fastapi>=0.110"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["hybrid_rag/dashboard/static"]

[tool.hatch.build.targets.wheel]
packages = ["hybrid_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
