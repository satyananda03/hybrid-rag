        description: 'Tabel dimensi wilayah, berisi daftar kabupaten/kota beserta provinsinya. Relasi yang valid hanya: (1) FK dari fact_sebaran_jejaring (JOIN ON fact_sebaran_jejaring.wilayah_id = dim_wilayah.wilayah_id), lalu GROUP BY provinsi atau kabupaten_kota untuk agregasi sebaran jejaring per wilayah; (2) pencocokan nilai kabupaten_kota dengan fact_insight_ikm / fact_insight_umkm. Tabel lain yang punya kolom wilayah sendiri (mis. fact_pelaku_ekraf) TIDAK terhubung ke tabel ini.'
