        - name: impact_potential_explanation_vector
          description: Pencarian semantik untuk dampak dan kebijakan. Gunakan saat user bertanya tentang kontribusi riset terhadap rekomendasi atau kebijakan ekonomi kreatif tertentu
          type: VECTOR(1024)
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
