            name: detail_program_requestor_partisipasi_id_fkey
        - name: account_id
          description: ID akun (UUID) pendaftar di platform ICCN, hanya terisi jika pendaftar login saat mengajukan (sebagian besar NULL). Tidak dapat di-JOIN ke dim_user.user_id (tidak ada yang cocok).
          type: UUID
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
