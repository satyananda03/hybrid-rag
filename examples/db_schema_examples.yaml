          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: research_topic_vector
          description: Pencarian semantik untuk topik riset. Gunakan saat user bertanya tentang judul penelitian, area kajian, atau fokus studi tertentu.
