        domain: Partisipasi Program
        description: 'Tabel yang menyimpan daftar data kota/kabupaten yang ingin mendapatkan pendampingan dalam pengembangan ekosistem kreatif yang berkelanjutan (sumber: requestors). Cakupan informasi: - Identitas Pendaftar: ID akun (account_id) dan alamat (address); nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar ada di fact_partisipasi_program (JOIN via partisipasi_id). - Minat Pendampingan: Program pendampingan yang diminati (programs - JSONB), program Catha Ekadasa yang diminati (subsectors - JSONB), dan area/ekosistem kreatif yang ingin dikembangkan (focus_area). - Letter of Interest (LoI): File LoI (loi_url) dan nomor dokumen LoI (document_number). NOTES : - JANGAN gunakan operator @> untuk JSONB array. Selalu cast menjadi text dan gunakan ILIKE untuk pencarian case-insensitive (misal: programs::text ILIKE ''%unesco%'').'
        primary_keys:
        - detail_id
        foreign_keys:
        - constrained_columns:
          - partisipasi_id
          referred_table: fact_partisipasi_program
          referred_schema: iccn_dwh
          referred_columns:
          - partisipasi_id
          name: detail_program_requestor_partisipasi_id_fkey
        columns:
        - name: detail_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: partisipasi_id
          description: |-
            ID partisipasi, foreign key ke fact_partisipasi_program.partisipasi_id. Satu baris = satu pendaftar program Requestor (permohonan pendampingan/kolaborasi ke ICCN).
            Gunakan JOIN ke fact_partisipasi_program ON partisipasi_id = fact_partisipasi_program.partisipasi_id untuk mengambil nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar.
