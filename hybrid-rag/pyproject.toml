[project]
name = "hybrid-rag"
version = "0.1.0"
description = "Knowledge-graph + vector RAG over PostgreSQL and Neo4j: document ingestion, deletion and mix retrieval."
requires-python = ">=3.11,<3.13"
# Retrieval needs only the base set; ingestion (Textract, PDF/image handling,
# Office conversion, text splitting) is the ``ingestion`` extra.
dependencies = [
    "asyncpg>=0.31.0,<1.0.0",
    "langchain-core>=1.0,<2",
    "neo4j>=6.2.0",
    "numpy>=1.24.0,<3.0.0",
    "pgvector>=0.4.2,<1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.1",
    "PyYAML>=6.0,<7.0",
    "sastrawi>=1.0.1",
    "tenacity",
    "tiktoken",
]

[project.optional-dependencies]
ingestion = [
    "boto3>=1.40.61",
    "langchain-text-splitters>=0.3,<2",
    "pillow>=10.1.0",
    "pymupdf>=1.28.0",
    # the `unoconvert` client; the server is ghcr.io/unoconv/unoserver-docker
    "unoserver==3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag"]
