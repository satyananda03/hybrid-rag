        - name: no_kontak
          description: Nomor kontak (HP/WhatsApp) jejaring. Bernilai '-' jika tidak ada; format tidak seragam (dengan/tanpa awalan 0).
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: status_tumbuh
          description: Nama jejaring tumbuh
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: status_tidak_aktif
          description: Nama jejaring yang tidak aktif
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
      iccn_knowledge_stats:
        name: iccn_knowledge_stats
        schema_name: iccn_dwh
        label: Knowledge Base ICCN
        domain: Knowledge Base
        description: 'Daftar dokumen yang sudah masuk ke knowledge base ICCN. Satu baris = satu dokumen. Sumber dokumen (source_type): Notion, Google Drive, Database (DWH), dan Document Upload (upload manual via dashboard ICCN).'
        primary_keys:
        - item_id
        foreign_keys: []
        columns:
        - name: item_id
          description: Primary Key
          type: TEXT
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: source_type
          description: 'Jenis sumber dokumen. Nilai: NOTION, DRIVE (Google Drive), DATABASE (DWH), DOCUMENT (Document Upload, upload manual via dashboard ICCN).'
          type: TEXT
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: source_name
          description: 'Nama sumber dokumen. DRIVE: nama folder Google Drive; NOTION: judul database Notion; DOCUMENT: "Document Upload".'
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: title
          description: Judul dokumen / nama file
          type: TEXT
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: file_type
          description: 'Ekstensi file (contoh: pdf, docx, xlsx, md); bernilai notion untuk halaman Notion.'
          type: TEXT
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: is_private
          description: Dokumen boleh dipakai oleh agent private (internal)
          type: BOOLEAN
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: is_public
          description: Dokumen boleh dipakai oleh agent public
          type: BOOLEAN
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: created_at
          description: Waktu dokumen ditambahkan ke knowledge base
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: false
          foreign_keys: []
        - name: ingested_at
          description: Waktu dokumen selesai diproses (ingest) ke knowledge base
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: deleted_at
          description: Waktu dokumen dihapus; NULL jika masih aktif
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
        - name: source_last_sync_at
          description: Waktu terakhir sumber dokumen berhasil disinkronkan; NULL untuk Document Upload
          type: TIMESTAMP
          is_primary_key: false
          is_nullable: true
          foreign_keys: []
business_concepts:
- name: Persentase UMKM Digital
  synonyms:
  - Tingkat Digitalisasi UMKM
  - UMKM go digital
  - UMKM online
  - adopsi digital UMKM
  description: |-
    Persentase UMKM yang sudah go digital (memasarkan produk secara online) dari seluruh UMKM.
    Tiap baris sudah agregat per kelurahan, jadi rasio dihitung dari total (SUM / SUM), bukan rata-rata rasio per kelurahan.
  sql: 100.0 * SUM(jumlah_umkm_digital) / NULLIF(SUM(jumlah_umkm), 0)
  columns:
  - iccn_dwh.fact_insight_umkm.jumlah_umkm_digital
  - iccn_dwh.fact_insight_umkm.jumlah_umkm
- name: Persentase UMKM Berlegalitas
  synonyms:
  - UMKM berizin
  - UMKM ber-NIB
  - legalitas UMKM
  - UMKM punya izin usaha
  description: |-
    Persentase UMKM yang sudah memiliki legalitas usaha (izin/NIB) dari seluruh UMKM.
    Tiap baris sudah agregat per kelurahan, jadi rasio dihitung dari total (SUM / SUM).
  sql: 100.0 * SUM(jumlah_umkm_berlegalitas) / NULLIF(SUM(jumlah_umkm), 0)
  columns:
  - iccn_dwh.fact_insight_umkm.jumlah_umkm_berlegalitas
  - iccn_dwh.fact_insight_umkm.jumlah_umkm
- name: Persentase IKM Berizin
  synonyms:
  - IKM berizin
  - perizinan IKM
  - IKM legal
  - tingkat perizinan industri kecil menengah
  description: |-
    Persentase industri kecil menengah (IKM) yang sudah memiliki izin dari seluruh IKM.
    Rata-rata rasio per kelurahan memberi angka yang terlalu tinggi; hitung SUM / SUM.
  sql: 100.0 * SUM(ikm_berizin) / NULLIF(SUM(jumlah_ikm), 0)
  columns:
  - iccn_dwh.fact_insight_ikm.ikm_berizin
  - iccn_dwh.fact_insight_ikm.jumlah_ikm
- name: Produktivitas Tenaga Kerja IKM
  synonyms:
  - nilai produksi per pekerja
  - output per tenaga kerja IKM
  - produktivitas pekerja IKM
  description: Nilai produksi IKM (Rupiah) per tenaga kerja, dihitung dari total nilai produksi dibagi total tenaga kerja.
  sql: SUM(total_nilai_produksi)::numeric / NULLIF(SUM(total_tenaga_kerja), 0)
  columns:
  - iccn_dwh.fact_insight_ikm.total_nilai_produksi
  - iccn_dwh.fact_insight_ikm.total_tenaga_kerja
- name: Jumlah Berita Terbit
  synonyms:
  - berita terbit
  - artikel terbit
  - jumlah publikasi berita
  - jumlah artikel
  description: |-
    Jumlah berita/artikel ICCN yang sudah live, yaitu berstatus published atau external (keduanya berita ICCN).
    Status scheduled dan revised belum terbit, jadi tidak dihitung.
  sql: COUNT(*)
  filters:
  - status IN ('published', 'external')
  columns:
  - iccn_dwh.fact_berita.status
  time_column: iccn_dwh.fact_berita.tanggal_publish_wib
- name: Rata-rata Views per Berita
  synonyms:
  - rata-rata pembaca berita
  - rata-rata pembaca artikel
  - avg views berita
  - engagement berita
  description: Rata-rata jumlah views per berita yang sudah live (published atau external). Berita scheduled dan revised tidak dihitung.
  sql: AVG(views)
  filters:
  - status IN ('published', 'external')
  columns:
  - iccn_dwh.fact_berita.views
  - iccn_dwh.fact_berita.status
  time_column: iccn_dwh.fact_berita.tanggal_publish_wib
- name: Jumlah Jejaring ICCN
  synonyms:
  - total jejaring ICCN
  - jumlah komunitas jejaring
  - banyaknya jejaring daerah
  description: |-
    Jumlah jejaring ICCN yang terdata (terdata, tumbuh, maupun tidak aktif).
    Tiap kolom nama yang terisi adalah satu jejaring tersendiri, jadi satu baris bisa berisi dua jejaring dan COUNT(*) per baris salah.
    '-' atau kosong berarti tidak ada jejaring; baris yang ketiganya '-' adalah wilayah tanpa jejaring.
  sql: |-
    COUNT(*) FILTER (WHERE TRIM(nama_jejaring) NOT IN ('', '-'))
    + COUNT(*) FILTER (WHERE TRIM(status_tumbuh) NOT IN ('', '-'))
    + COUNT(*) FILTER (WHERE TRIM(status_tidak_aktif) NOT IN ('', '-'))
  columns:
  - iccn_dwh.fact_sebaran_jejaring.nama_jejaring
  - iccn_dwh.fact_sebaran_jejaring.status_tumbuh
  - iccn_dwh.fact_sebaran_jejaring.status_tidak_aktif
- name: Jumlah Jejaring Tumbuh
  synonyms:
  - jejaring tumbuh
  - komunitas tumbuh
  - jejaring yang sedang tumbuh
  description: Jumlah jejaring berstatus tumbuh. Kolom status_tumbuh berisi nama jejaringnya; '-' atau kosong berarti bukan jejaring tumbuh.
  sql: COUNT(*)
  filters:
  - TRIM(status_tumbuh) NOT IN ('', '-')
  columns:
  - iccn_dwh.fact_sebaran_jejaring.status_tumbuh
- name: Persentase Pelaku Ekraf ber-HKI
  synonyms:
  - pelaku ekraf punya HKI
  - pelaku ekraf ber-HAKI
  - kepemilikan HKI pelaku ekraf
  - pelaku ekraf dengan merek atau hak cipta
  description: |-
    Persentase pelaku ekonomi kreatif (Sulawesi Tenggara) yang memiliki minimal satu HKI.
    Satu pelaku bisa punya beberapa HKI, jadi hitung pelaku unik (COUNT DISTINCT); LEFT JOIN agar pelaku tanpa HKI tetap jadi penyebut.
  sql: 100.0 * COUNT(DISTINCT h.sumber_pelaku_id) / NULLIF(COUNT(DISTINCT p.sumber_id), 0)
  from: iccn_dwh.fact_pelaku_ekraf p LEFT JOIN iccn_dwh.bridge_pelaku_hki h ON h.sumber_pelaku_id = p.sumber_id
  columns:
  - iccn_dwh.bridge_pelaku_hki.sumber_pelaku_id
  - iccn_dwh.fact_pelaku_ekraf.sumber_id
