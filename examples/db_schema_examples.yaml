      detail_program_ip_event:
        name: detail_program_ip_event
        schema_name: iccn_dwh
        label: Detail Open Call IP Event
        domain: Partisipasi Program
        description: 'Tabel utama yang menyimpan data pengajuan Intelectual Property (IP) berupa events/festival melalui program Open Call IP Events. Cakupan informasi : - Identitas Festival: Nama festival (festival_name), tingkat/skala (festival_level), lokasi penyelenggaraan (province, city, main_venue), waktu & durasi (event_date, duration),  media sosial (social_media), serta riwayat penyelenggaraan (first_year, current_edition). - Data Penyelenggara & Kontak: Nama entitas penyelenggara (organizer_name), bentuk kelembagaan (institutional_form), tahun berdiri (established_year),  alamat sekretariat (secretariat_address), status badan hukum (has_legal_entity), dan informasi penanggung jawab/PIC (pic_name, email, pic_phone). - Konsep & Skala Kegiatan: Tujuan (festival_purpose), narasi latar belakang (background_narrative), nilai budaya (cultural_values), keunikan (uniqueness), tema tahunan (has_annual_theme), daftar kegiatan utama (main_activities), dan jumlah kegiatan (total_activities). - Keterlibatan Ekosistem: Keterlibatan seniman lokal/nasional (involves_local_community, involves_national_artist, involved_artists), pelibatan UMKM (involves_local_umkm, umkm_tenant_count, umkm_product_types), dan estimasi pengunjung (estimated_visitors) serta jumlah pelaku kreatif (total_creative_actors). - Dampak & Ekonomi: Total anggaran (total_budget), sumber dana (funding_sources), estimasi perputaran uang (estimated_economic_turnover, turnover_per_activity), metode transaksi (transaction_methods), serta berbagai dampak turunan (impact_economy, impact_ecosystem, impact_pad, impact_policy, impact_tourism, impact_reputation). - Infrastruktur & Kesiapan Teknis: Dukungan Pemda (has_local_gov_support), mitra utama (main_partners), akses transportasi (transportation_types, venue_distance), fasilitas akomodasi/umum (hotel_availability_count, public_facilities), serta kesiapan keamanan dan SDM (has_security_coordination, has_security_sop, core_committee_count, total_committee_count). - Lampiran Dokumen: SOP keamanan (security_sop_file), struktur organisasi (organization_structure_file), laporan lalu (previous_report_file), video dokumentasi (documentation_video_link), dan proposal mendatang (future_proposal_file). - Harapan Kolaborasi: Tantangan yang dihadapi (challenges), ekspektasi dukungan (expected_support), dan harapan bergabung dengan ICCN (iccn_network_expectations). NOTES : - JANGAN gunakan operator @> untuk JSONB array.  - Selalu cast menjadi text dan gunakan ILIKE untuk pencarian case-insensitive (misal: main_activities::text ILIKE ''%pertunjukan seni%'').'
        primary_keys:
        - detail_id
        foreign_keys:
        - constrained_columns:
          - partisipasi_id
          referred_table: fact_partisipasi_program
          referred_schema: iccn_dwh
          referred_columns:
          - partisipasi_id
          name: detail_program_ip_event_partisipasi_id_fkey
        columns:
        - name: detail_id
          description: Primary Key
          type: INTEGER
          is_primary_key: true
          is_nullable: false
          foreign_keys: []
        - name: partisipasi_id
          description: |-
            ID partisipasi, foreign key ke fact_partisipasi_program.partisipasi_id. Satu baris = satu pendaftar program Open Call IP Event.
            Gunakan JOIN ke fact_partisipasi_program ON partisipasi_id = fact_partisipasi_program.partisipasi_id untuk mengambil nama pendaftar, institusi, peran, provinsi, kota, email, phone, dan tanggal daftar.
          type: INTEGER
          is_primary_key: false
          is_nullable: false
          foreign_keys:
          - referred_table: fact_partisipasi_program
            referred_schema: iccn_dwh
            referred_columns:
            - partisipasi_id
            name: detail_program_ip_event_partisipasi_id_fkey
